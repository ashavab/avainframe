name: Sync Immich Portfolio

on:
  schedule:
    # Run twice a day (at 00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch:
    # Allow manual triggering from the GitHub web UI

permissions:
  contents: write # Needed to commit and push changes back to the repository

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Portfolio Sync
        env:
          VITE_IMMICH_URL: https://photos.avainframe.com
          VITE_IMMICH_SHARE_KEY: ${{ secrets.VITE_IMMICH_SHARE_KEY }}
        run: npm run portfolio:sync

      - name: Commit and Push Changes
        uses: stefanzweifel/git-commit-push-action@v10
        with:
          commit_message: "chore: auto-sync portfolio photos [skip ci]"
          file_pattern: 'public/galleries/ src/app/data/portfolioGenerated.ts'
