<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Gallery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .hero { margin-bottom: 40px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .hero img { width: 100%; height: auto; display: block; max-height: 500px; object-fit: cover; }
    .hero-content { background: white; padding: 30px; text-align: center; }
    .hero-content h1 { font-size: 2.5rem; margin-bottom: 10px; color: #1a1a1a; }
    .hero-content p { font-size: 1.1rem; color: #666; line-height: 1.6; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 20px; margin-top: 20px; }
    .gallery-item { position: relative; overflow: hidden; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform .3s, box-shadow .3s; display: block; text-decoration: none; background: white; aspect-ratio: 3/2; }
    .gallery-item:hover { transform: translateY(-4px); box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
    .gallery-item img { width:100%; height:100%; object-fit:cover; display:block; }
    .gallery-caption { position:absolute; bottom:0; left:0; right:0; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); color: white; padding: 20px 15px 15px; font-size: .95rem; font-weight:500; text-align:left; opacity:0; transition: opacity .3s; }
    .gallery-item:hover .gallery-caption { opacity: 1; }
    .status { text-align:center; padding:40px; color:#888; }
    @media (max-width:768px) { .hero-content h1 { font-size:2rem } .gallery-grid{ grid-template-columns: repeat(auto-fill,minmax(200px,1fr)); gap:15px } }
    @media (max-width:480px) { .container{ padding:10px } .hero-content{ padding:20px } .hero-content h1{ font-size:1.5rem } .gallery-grid{ grid-template-columns: repeat(auto-fill,minmax(150px,1fr)); gap:10px } }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <div class="hero-content">
        <h1>Family</h1>
        <p>Browse our family photography collection</p>
      </div>
    </div>
    <div class="gallery-grid" id="grid"></div>
    <div class="status" id="status">Loading family gallery…</div>
  </div>
  <script>
    const ALBUM_ID = "154e07a8-48c1-403c-8d14-f9332ed541ac";
    const SHARE_KEY = "GAyAjlEkY1sP4vBh_lUQxC86vpAFkV1cV6E-cihzsYs6FXYkgaSsWmRWGvKxCHKjG-w";
    const IMMICH = "https://backup.avainframe.com";
    const thumb = (id, key, size) => IMMICH + "/api/assets/" + id + "/thumbnail?key=" + key + "&size=" + size;

    (async () => {
      const status = document.getElementById("status");
      const grid = document.getElementById("grid");
      try {
        const res = await fetch("/api/family-gallery?albumId=" + ALBUM_ID + "&key=" + SHARE_KEY);
        if (!res.ok) throw new Error("Gallery fetch failed: " + res.status);
        const data = await res.json();
        const assets = data.assets || [];
        if (!assets.length) { status.textContent = "No photos in this gallery yet."; return; }
        status.remove();
        const hero = document.querySelector(".hero");
        const himg = document.createElement("img");
        himg.src = thumb(assets[0].id, data.shareKey, "preview");
        himg.alt = "Family";
        hero.insertBefore(himg, hero.firstChild);
        assets.forEach((a) => {
          const link = document.createElement("a");
          link.className = "gallery-item";
          link.href = thumb(a.id, data.shareKey, "preview");
          const img = document.createElement("img");
          img.src = thumb(a.id, data.shareKey, "thumbnail");
          img.alt = a.originalFileName || "photo";
          img.loading = "lazy";
          const cap = document.createElement("div");
          cap.className = "gallery-caption";
          cap.textContent = (a.originalFileName || "").replace(/\.(jpg|jpeg|png)$/i, "");
          link.appendChild(img);
          link.appendChild(cap);
          grid.appendChild(link);
        });
      } catch (e) {
        status.textContent = "Could not load gallery: " + e.message;
      }
    })();
  </script>
</body>
</html>
