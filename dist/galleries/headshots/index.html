<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Headshots Gallery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .hero { margin-bottom: 40px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .hero img { width: 100%; height: auto; display: block; max-height: 500px; object-fit: cover; }
    .hero-content { background: white; padding: 30px; text-align: center; }
    .hero-content h1 { font-size: 2.5rem; margin-bottom: 10px; color: #1a1a1a; }
    .hero-content p { font-size: 1.1rem; color: #666; line-height: 1.6; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 20px; margin-top: 20px; }
    .gallery-item { position: relative; overflow: hidden; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform .3s, box-shadow .3s; display: block; text-decoration: none; background: white; aspect-ratio: 3/2; }
    .gallery-item:hover { transform: translateY(-4px); box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
    .gallery-item img { width:100%; height:100%; object-fit:cover; display:block; }
    .gallery-caption { position:absolute; bottom:0; left:0; right:0; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); color: white; padding: 20px 15px 15px; font-size: .95rem; font-weight:500; text-align:left; opacity:0; transition: opacity .3s; }
    .gallery-item:hover .gallery-caption { opacity: 1; }
    @media (max-width:768px) { .hero-content h1 { font-size:2rem } .gallery-grid{ grid-template-columns: repeat(auto-fill,minmax(200px,1fr)); gap:15px } }
    @media (max-width:480px) { .container{ padding:10px } .hero-content{ padding:20px } .hero-content h1{ font-size:1.5rem } .gallery-grid{ grid-template-columns: repeat(auto-fill,minmax(150px,1fr)); gap:10px } }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <img src="DSC01509.png" alt="Headshots" />
      <div class="hero-content">
        <h1>Headshots</h1>
        <p>Browse our headshots photography collection</p>
      </div>
    </div>

    <div class="gallery-grid">

    <a href="DSC01509.png" class="gallery-item" title="DSC01509">
      <img src="DSC01509.png" alt="DSC01509" loading="lazy" />
      <div class="gallery-caption">DSC01509</div>
    </a>

    <a href="DSC01816.png" class="gallery-item" title="DSC01816">
      <img src="DSC01816.png" alt="DSC01816" loading="lazy" />
      <div class="gallery-caption">DSC01816</div>
    </a>

    <a href="DSC02032.png" class="gallery-item" title="DSC02032">
      <img src="DSC02032.png" alt="DSC02032" loading="lazy" />
      <div class="gallery-caption">DSC02032</div>
    </a>

    <a href="DSC02267.png" class="gallery-item" title="DSC02267">
      <img src="DSC02267.png" alt="DSC02267" loading="lazy" />
      <div class="gallery-caption">DSC02267</div>
    </a>
    </div>
  </div>
</body>
</html>
