<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real Estate Gallery</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }
    .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; text-align: center; }
    .message { background: white; border-radius: 18px; padding: 40px 30px; box-shadow: 0 12px 30px rgba(0,0,0,0.08); }
    h1 { font-size: 2.5rem; margin-bottom: 20px; }
    p { font-size: 1.05rem; line-height: 1.7; color: #555; }
    a { color: #1f6feb; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="message">
      <h1>Real Estate Gallery</h1>
      <p>This gallery is ready for your images. Drop photos into <strong>public/galleries/real-estate</strong> and run <code>npm run galleries:generate</code>.</p>
      <p>Once images are added, this page will update automatically.</p>
    </div>
  </div>
</body>
</html>
